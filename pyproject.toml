[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-analyzing-winapp"
version = "0.1.0"
description = "Windows desktop shell for Coil-Analyzing modeling core"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "PySide6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
